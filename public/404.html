<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting • LUMIÈRE ROSE</title>
    <script>
      // Single Page App redirect fallback for GitHub Pages
      (function() {
        var pathSegments = window.location.pathname.split('/').filter(Boolean);
        // If hosted on GitHub Pages user.github.io/reponame, keep repo name in path
        var isGithub = window.location.hostname.indexOf('github.io') !== -1;
        var repo = isGithub && pathSegments.length > 0 ? pathSegments[0] : '';
        var redirectUrl = window.location.origin + (repo ? '/' + repo + '/' : '/') + window.location.search + window.location.hash;
        window.location.replace(redirectUrl);
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #FFFDF9;
        color: #2D2527;
        text-align: center;
      }
      .card {
        padding: 32px;
        background: #FFFFFF;
        border: 1px solid #F1E5E7;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="margin: 0 0 8px 0; font-family: serif; color: #2D2527;">LUMIÈRE ROSE</h2>
      <p style="margin: 0; color: #7A696C;">Loading page...</p>
    </div>
  </body>
</html>
